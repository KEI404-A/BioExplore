<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>BioExplore</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component/dist/aframe-event-set-component.min.js"></script>
  <script src="https://unpkg.com/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  <script src="/js/joystick.js"></script>
  <style>
    .ui-buttons {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10000;
      display: flex;
      gap: 10px;
    }

    .ui-button {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: 1px solid #3a7bd5;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .ui-button:hover {
      background: rgba(58, 123, 213, 0.9);
    }

    .ui-button i {
      font-size: 16px;
    }



    button {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    #btnCalculate {
        background-color: #2e88ff;
        color: white;
    }

    #btnCalculate:hover {
        background-color: #7bdcff;
    }

    /* VR Button - Hidden */
    .a-enter-vr-button {
      display: none !important;
    }

    #custom-vr-btn {
      display: none !important;
    }

    /* Final Question Popup */
    .final-question-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(26, 26, 46, 0.98);
      border: 2px solid #4CC3D9;
      border-radius: 15px;
      padding: 30px;
      z-index: 10000;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      display: none;
    }

    .final-question-popup h3 {
      color: #4CC3D9;
      margin-bottom: 20px;
      text-align: center;
      font-size: 24px;
    }

    .question-item {
      margin-bottom: 20px;
      color: #ffffff;
    }

    .question-item p {
      margin-bottom: 10px;
      font-weight: bold;
    }

    .question-item input[type="radio"] {
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .question-item textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #4CC3D9;
      border-radius: 5px;
      background: rgba(13, 21, 32, 0.8);
      color: #ffffff;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
    }

    .question-item label {
      display: block;
      margin-bottom: 5px;
      cursor: pointer;
    }

    #submitAnswer {
      background: #4CC3D9;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      margin-top: 20px;
      transition: background 0.3s;
    }

    #submitAnswer:hover {
      background: #7bdcff;
    }

    /* Compass Styles */
    #compass {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10001;
      width: 120px;
      height: 120px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #4CC3D9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(76, 195, 217, 0.5);
    }

    #compass-inner {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(26, 26, 46, 0.9);
    }

    #compass-needle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 40px;
      background: linear-gradient(to top, #ff0000, #ffffff);
      transform-origin: bottom center;
      transform: translate(-50%, -100%) rotate(0deg);
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    .compass-label {
      position: absolute;
      color: #4CC3D9;
      font-size: 12px;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(76, 195, 217, 0.8);
    }

    #compass-n {
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
    }

    #compass-s {
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
    }

    #compass-e {
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    #compass-w {
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    #compass-direction {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #4CC3D9;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(76, 195, 217, 1);
      margin-top: 15px;
    }
  </style>
  <script>
    // Device Toggle Functionality
    function setupDeviceToggle() {
      const deviceToggle = document.getElementById('device-toggle');
      const mobileControls = document.getElementById('mobile-controls');
      const sceneEl = document.querySelector('a-scene');
      let joystick = null;

      // Update UI based on current device mode
      function updateDeviceUI() {
        const currentMode = localStorage.getItem('deviceType') || 'desktop';
        if (deviceToggle) {
          let icon, text;
          switch (currentMode) {
            case 'mobile':
              icon = '🖥️';
              text = 'Switch to Desktop';
              break;
            default: // desktop
              icon = '📱';
              text = 'Switch to Mobile';
          }
          deviceToggle.innerHTML = `<i>${icon}</i><span>${text}</span>`;

          // Update mobile controls visibility
          if (mobileControls) {
            mobileControls.style.display = currentMode === 'mobile' ? 'block' : 'none';
          }
        }
      }

    }
  </script>
</head>
<body>

    <!-- Compass -->
    <div id="compass">
      <div id="compass-inner">
        <div class="compass-label" id="compass-n">N</div>
        <div class="compass-label" id="compass-s">S</div>
        <div class="compass-label" id="compass-e">E</div>
        <div class="compass-label" id="compass-w">W</div>
        <div id="compass-needle"></div>
        <div id="compass-direction">N</div>
      </div>
    </div>

    <!-- Virtual Gamepad for Mobile -->
    <div id="mobile-controls" style="position: fixed; bottom: 30px; left: 20px; z-index: 1000; display: none; touch-action: none; -webkit-tap-highlight-color: transparent;">
      <!-- Joystick Control -->
      <div id="joystick" style="width: 120px; height: 120px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; position: relative; overflow: visible;">
        <div id="joystick-knob" style="width: 80px; height: 80px; background: rgba(255, 255, 255, 0.5); border-radius: 50%; position: absolute; left: 20px; top: 20px; transition: transform 0.1s ease-out; touch-action: none; pointer-events: none;"></div>
      </div>
    </div>

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      style="height: 100vh;"
      renderer="antialias: false; sortObjects: false; colorManagement: false; physicallyCorrectLights: false; shadowMap: false; precision: lowp; logarithmicDepthBuffer: false; powerPreference: high-performance; preserveDrawingBuffer: false">
      
      
      <!-- Assets - Conditional Loading dengan Optimasi -->
      <a-assets timeout="30000">
        <img id="thumbScene1" crossorigin="anonymous" src="https://cdn.aframe.io/link-traversal/thumbs/forest.png" />
        
        <!-- GLB Models untuk Scene 2 - Prioritas Loading -->
        <!-- Model kecil di-load dulu -->
        <a-asset-item id="desk-model" src="assets/asset scene 2/Desk.glb"></a-asset-item>
        <a-asset-item id="bunsen-model" src="assets/asset scene 2/bunsen+burner.glb"></a-asset-item>
        <a-asset-item id="petri-model" src="assets/asset scene 2/Petri+dish.glb"></a-asset-item>
        <a-asset-item id="thermometer-model" src="assets/asset scene 2/LanzoTherm+3000.glb"></a-asset-item>
        <a-asset-item id="deodorant-model" src="assets/asset scene 2/axe_deodorant.glb"></a-asset-item>
        
        <!-- Model besar - Lazy Load setelah scene ready -->
        <!-- cotton-swab akan di-load via JavaScript setelah model lain selesai -->
        
        <!-- Fallback untuk jika GLB tidak tersedia -->
        <a-mixin id="fallback-box"
                 geometry="primitive: box; width: 2; height: 1; depth: 1"
                 material="color: #8B4513"></a-mixin>
        <a-mixin id="fallback-ground" 
                 geometry="primitive: plane; width: 20; height: 20"
                 material="color: #228B22"
                 rotation="-90 0 0"></a-mixin>
      </a-assets>

      <a-entity id="environment"></a-entity>

      <a-entity id="fallback-environment">
        <!-- Ground plane -->
        <a-plane
          position="0 0 0"
          rotation="-90 0 0"
          width="20"
          height="20"
          color="#228B22"
          class="collidable"
          visible="true">
        </a-plane>
        
        <!-- Ceiling untuk mencegah player terbang (jika fly diaktifkan) -->
        <a-plane
          position="0 4 0"
          rotation="90 0 0"
          width="20"
          height="20"
          color="#87CEEB"
          class="collidable"
          visible="false">
        </a-plane>
        
        <!-- Boundary walls untuk membatasi area pergerakan (20x20 area) -->
        <!-- North wall (depan) -->
        <a-plane 
          class="collidable" 
          position="0 2 -10" 
          width="20" 
          height="4" 
          color="#87CEEB"
          visible="false">
        </a-plane>
        
        <!-- South wall (belakang) -->
        <a-plane 
          class="collidable" 
          position="0 2 10" 
          width="20" 
          height="4" 
          color="#87CEEB"
          visible="false">
        </a-plane>
        
        <!-- West wall (kiri) -->
        <a-plane 
          class="collidable" 
          position="-10 2 0" 
          rotation="0 90 0" 
          width="20" 
          height="4" 
          color="#87CEEB"
          visible="false">
        </a-plane>
        
        <!-- East wall (kanan) -->
        <a-plane 
          class="collidable" 
          position="10 2 0" 
          rotation="0 -90 0" 
          width="20" 
          height="4" 
          color="#87CEEB"
          visible="false">
        </a-plane>
        
        <!-- Corner blocks untuk collision yang lebih baik -->
        <a-box class="collidable" position="-10 2 -10" width="0.5" height="4" depth="0.5" visible="false"></a-box>
        <a-box class="collidable" position="10 2 -10" width="0.5" height="4" depth="0.5" visible="false"></a-box>
        <a-box class="collidable" position="-10 2 10" width="0.5" height="4" depth="0.5" visible="false"></a-box>
        <a-box class="collidable" position="10 2 10" width="0.5" height="4" depth="0.5" visible="false"></a-box>
      </a-entity>

      <!-- Laboratory Setup -->
      <a-entity id="laboratory-setup">
        
        <!-- Meja Laboratorium Utama - Diposisikan di tengah map -->
        <a-entity
          id="main-desk"
          gltf-model="#desk-model"
          position="2 0 -1.5"
          rotation="0 90 0"
          scale="0.048 0.048 0.048"
          class="collidable"
          visible="true"
          frustum-culled="true">
          <!-- Collision box untuk memastikan meja tidak bisa ditembus -->
          <a-box
            class="collidable"
            position="0 0.24 0"
            width="1.2"
            height="0.48"
            depth="0.6"
            visible="false"
            material="opacity: 0; transparent: true">
          </a-box>
        </a-entity>

        <!-- Pembakar Bunsen - Dikecilkan dan diletakkan di atas meja -->
        <a-entity
          id="bunsen-burner"
          gltf-model="#bunsen-model"
          position="1.85 0.6 -1.5"
          rotation="0 0 0"
          scale="0.02 0.02 0.02"
          class="clickable lab-equipment"
          data-action="toggle-bunsen"
          frustum-culled="true">
          <!-- Label - Disesuaikan posisi untuk ukuran baru -->
        <a-text
            value="Bunsen Burner"
            position="0 0.15 0"
          align="center"
            color="#fff"
            width="1.5"
            visible="false"
            id="bunsen-label"
            material="depthTest: false; transparent: true">
        </a-text>
        </a-entity>

        <!-- Cawan Petri - Dikecilkan dan diletakkan di atas meja -->
        <a-entity
          id="petri-dish"
          gltf-model="#petri-model"
          position="2.1 0.6 -1.5"
          rotation="0 0 0"
          scale="0.015 0.015 0.015"
          class="clickable lab-equipment"
          data-action="apply-sample"
          frustum-culled="true">
          <!-- Label - Disesuaikan posisi untuk ukuran baru -->
        <a-text
            value="Petri Dish"
            position="0 0.15 0"
          align="center"
            color="#fff"
            width="1.5"
            visible="false"
            id="petri-label"
            material="depthTest: false; transparent: true">
        </a-text>
        </a-entity>

        <!-- Termometer - Dikecilkan dan diletakkan di atas meja -->
        <a-entity
          id="thermometer"
          gltf-model="#thermometer-model"
          position="2.2 0.6 -1.5"
          rotation="0 0 0"
          scale="0.015 0.015 0.015"
          class="clickable lab-equipment"
          data-action="measure-temperature"
          frustum-culled="true">
          <!-- Label - Disesuaikan posisi untuk ukuran baru -->
          <a-text
            value="Thermometer"
            position="0 0.15 0"
            align="center"
            color="#fff"
            width="1.5"
            visible="false"
            id="thermometer-label"
            material="depthTest: false; transparent: true">
          </a-text>
          <!-- Temperature Display - Disesuaikan posisi -->
          <a-text
            id="temperature-display"
            value="Suhu: --°C"
            position="0 0.3 0"
            align="center"
            color="#4CC3D9"
            width="1.5"
          visible="false"
            material="depthTest: false; transparent: true">
          </a-text>
          </a-entity>

        <!-- Toples Kapas - Lazy Load (Model besar 57MB) - Dikecilkan dan diletakkan di atas meja -->
        <!-- Fallback box sementara, akan diganti setelah model loaded -->
          <a-entity
          id="cotton-jar"
          position="1.3 0.6 -1.5"
          rotation="0 0 0"
          scale="0.03 0.03 0.03"
          class="clickable lab-equipment"
          data-action="take-sample">
          <!-- Fallback box sementara - Disesuaikan dengan scale baru -->
        <a-box
            id="cotton-jar-fallback"
            width="0.15"
            height="0.18"
            depth="0.15"
            color="#8B7355"
            material="metalness: 0.3; roughness: 0.7">
        </a-box>
          <!-- Label - Disesuaikan posisi untuk ukuran baru -->
        <a-text
            value="Cotton Swab"
            position="0 0.2 0"
          align="center"
            color="#fff"
            width="1.5"
            visible="false"
            id="cotton-label"
            material="depthTest: false; transparent: true">
        </a-text>
        </a-entity>

        <!-- Deodoran/Bahan Kimia - Dikecilkan dan diletakkan di atas meja -->
        <a-entity
          id="deodorant"
          gltf-model="#deodorant-model"
          position="2.7 0.6 -1.5"
          rotation="0 0 0"
          scale="0.025 0.025 0.025"
          class="clickable lab-equipment"
          data-action="add-deodorant"
          frustum-culled="true">
          <!-- Label - Disesuaikan posisi untuk ukuran baru -->
        <a-text
            value="Deodorant"
            position="0 0.2 0"
          align="center"
            color="#fff"
            width="1.5"
            visible="false"
            id="deodorant-label"
            material="depthTest: false; transparent: true">
        </a-text>
        </a-entity>

        </a-entity>

      <!-- Portal Kembali ke Menu -->
      <a-link
        position="0 1.6 6"
        rotation="0 180 0"
        link="on: click"
        href="vr.html"
        title="Kembali ke Menu"
        image="#thumbScene1"
        class="clickable"
        event-set__mouseenter="material.opacity: 0.8"
        event-set__mouseleave="material.opacity: 0.6">
      </a-link>

      <!-- Sky dan pencahayaan - Minimal untuk performa -->
      <a-sky color="#87CEEB"></a-sky>
      <!-- Hanya ambient dan directional light untuk performa maksimal -->
      <a-light type="ambient" color="#404040" intensity="0.7"></a-light>
      <a-light type="directional" 
               position="5 10 5" 
               intensity="0.9">
      </a-light>
      
      <!-- Loading Indicator -->
      <a-entity id="loading-indicator" position="0 2 -2">
        <a-box
          width="3"
          height="0.3"
          depth="0.1"
          color="#1a1a2e"
          opacity="0.9">
          </a-box>
        <a-text
          id="loading-text"
          value="Loading assets..."
          position="0 0 0.06"
          align="center"
          color="#4CC3D9"
          width="4"
          material="depthTest: false; transparent: true">
        </a-text>
      </a-entity>

      <!-- Kamera dengan movement controls seperti di vr.html - Support sprint -->
      <a-entity
        id="rig"
        position="0 1.6 8"
        movement-controls="speed: 0.3; constrainToNavMesh: false; fly: false; acceleration: 65"
        collider="distance: 1.2; enabled: true">
        <a-entity
          id="player"
          class="camera"
          camera
          position="0 0 0"
          look-controls="pointerLockEnabled: true; reverseMouseDrag: false"
          pointer-lock="enabled: true">
          <a-entity
            id="reticle"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.018; radiusOuter: 0.025"
            material="shader: flat; opacity: 1.0; color: #fff; depthTest: false; depthWrite: false; transparent: false"
            cursor="fuse: true; fuseTimeout: 1200"
            raycaster="objects: .clickable, #instruction-panel, #btnStartExperiment"
            animation__fuse="property: scale; startEvents: fusing; from: 1 1 1; to: 0.2 0.2 0.2; dur: 1200; easing: linear"
            animation__reset="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 120">
          </a-entity>
        </a-entity>
      </a-entity>
      
      <!-- Instruction Panel -->
      <a-entity id="instruction-panel" position="0 2 -4" rotation="0 0 0">
        <!-- Background Panel -->
          <a-box 
          width="5"
          height="3.5"
          depth="0.1"
          color="#1a1a2e"
          opacity="0.95"
          material="metalness: 0.7; roughness: 0.3; depthTest: true; depthWrite: true"
          class="collidable">
        </a-box>
        
        <!-- Border -->
        <a-box
          width="5.1"
          height="3.6"
          depth="0.05"
          position="0 0 -0.03"
          color="#4CC3D9"
            opacity="0.3"
          material="metalness: 0.8; roughness: 0.2">
            </a-box>
        
        <!-- Title -->
            <a-text
          value="KEGIATAN 2: EKSPERIMEN BIOLOGI"
          position="0 1.3 0.06"
              align="center"
          color="#4CC3D9"
          width="6"
            material="depthTest: false; transparent: true">
          </a-text>

        <!-- Instructions -->
          <a-text
          id="instruction-text"
          value="1. Ambil sampel menggunakan cotton swab\n2. Oleskan ke cawan petri\n3. Tambahkan deodoran\n4. Amati pertumbuhan bakteri"
          position="0 0.2 0.06"
            align="center"
              color="#ffffff"
                width="4.5"
          line-height="50"
          material="depthTest: false; transparent: true">
              </a-text>

        <!-- Start Button -->
              <a-box
          id="btnStartExperiment"
          class="clickable"
          width="2"
          height="0.5"
          depth="0.1"
          position="0 -1.1 0.06"
          color="#4CC3D9"
          material="metalness: 0.8; roughness: 0.2"
          event-set__mouseenter="scale:1.1 1.1 1.1; color:#7bdcff"
          event-set__mouseleave="scale:1 1 1; color:#4CC3D9">
              </a-box>
              <a-text
          value="MULAI EKSPERIMEN"
          position="0 -1.1 0.11"
                align="center"
                color="#ffffff"
            width="3"
          material="depthTest: false; transparent: true">
              </a-text>
            </a-entity>

      <!-- Observation Results (Initially Hidden) -->
      <a-entity id="observation-results" class="observation-content" visible="false">
        
        <!-- Result Panel Background -->
              <a-box
          width="6"
          height="4"
          depth="0.1"
          position="0 1.5 -5"
          color="#1a1a2e"
                opacity="0.95"
          material="metalness: 0.7; roughness: 0.3">
              </a-box>
        
        <!-- Title -->
              <a-text
          value="HASIL OBSERVASI"
          position="0 3  -4.95"
                align="center"
          color="#4CC3D9"
          width="5"
          material="depthTest: false; transparent: true">
              </a-text>
        
        <!-- Data Panel -->
          <a-box
          width="5"
          height="1.5"
            depth="0.05"
          position="0 0.5 -4.95"
          color="#0d1520"
          opacity="0.9">
          </a-box>
          <a-text
          id="experiment-data"
          value="Suhu: 37°C\nWaktu Observasi: 24 jam\nHasil: Pertumbuhan bakteri berkurang setelah treatment"
          position="0 0.5 -4.9"
            align="center"
          color="#fff"
          width="4.5"
          line-height="50"
          material="depthTest: false; transparent: true">
              </a-text>
            </a-entity>

  </a-scene>

    <script>
    // Experiment State Management
    const experimentState = {
      step: 0, // 0: intro, 1: sampling, 2: culture, 3: treatment, 4: observation, 5: question
      sampleTaken: false,
      sampleApplied: false,
      deodorantAdded: false,
      bunsenOn: false,
      temperature: null,
      observationComplete: false
    };

      // Flag untuk cek apakah model berhasil dimuat
      let modelsLoaded = false;
      let blockAnimationState = 'idle';
      
    // Setup mobile controls
      function setupMobileControls() {
        const camera = document.querySelector('[camera]');
        const rig = document.getElementById('rig');

        if (!camera) {
          console.error('Camera element not found');
          return;
        }

        let joystick = null;
        const movementSpeed = 0.1;
        let isMobile = false;
        
        // Initialize joystick
        function initJoystick() {
          joystick = new JoyStick('joystick', {
            title: 'joystick',
            width: 150,
            height: 150,
            internalFillColor: 'rgba(255, 255, 255, 0.5)',
            internalLineWidth: 2,
            internalStrokeColor: '#FFFFFF',
            externalLineWidth: 2,
            externalStrokeColor: 'rgba(255, 255, 255, 0.3)',
            autoReturnToCenter: true
          }, function (stickData) {
            if (stickData.x !== 0 || stickData.y !== 0) {
              updateCameraMovement(stickData.x, stickData.y);
            }
          });
        }
        
        // Update camera movement based on joystick input
      // Menggunakan movement-controls jika tersedia, atau manual movement
        function updateCameraMovement(x, y) {
          if (!camera) return;
          
        const rig = document.getElementById('rig');
        if (!rig) return;
        
        // Coba gunakan movement-controls component jika tersedia

    AFRAME.registerComponent('always-visible', {
      init: function () {

        this.lastCheck = 0;
        this.checkInterval = 500; // Check setiap 500ms untuk performa
      },
      tick: function (time) {
        // Throttle check untuk performa
        if (time - this.lastCheck < this.checkInterval) {
          return;
        }

    // Player collider: Mencegah player menembus objek .collidable dan boundary walls
    // Optimized untuk performa - hanya check arah pergerakan
    AFRAME.registerComponent('collider', {
      schema: { 
        distance: { default: 1.2 },
        debug: { default: false },
        enabled: { default: true } // Enabled untuk boundary detection
      },
      init: function () {
        if (!this.data.enabled) {
          return;
        }
        
        this.raycaster = new THREE.Raycaster();
        this.lastSafePosition = new THREE.Vector3();
        // Hanya check 4 arah utama untuk performa maksimal (diagonal dihapus)
        this.directions = [
          new THREE.Vector3(0, 0, -1), // forward
          new THREE.Vector3(0, 0, 1), // backward
          new THREE.Vector3(-1, 0, 0), // left
          new THREE.Vector3(1, 0, 0), // right
        ];
        this.lastTick = 0;
        this.tickInterval = 200; // Update setiap 200ms (5 FPS untuk collision check) - lebih jarang
        this.collidables = null; // Cache collidables
        this.el.addEventListener('loaded', () => {
          this.el.object3D.getWorldPosition(this.lastSafePosition);
        });
      },
      tick: function (time, delta) {
        if (!this.data.enabled) {
          return;
        }
        
        // Throttle collision checks untuk performa
        if (time - this.lastTick < this.tickInterval) {
          return;
        }
        this.lastTick = time;

        // Cache collidables (update hanya sekali saat pertama kali atau jika perlu)
        if (!this.collidables) {
          const collidableEls = this.el.sceneEl.querySelectorAll('.collidable');
          if (collidableEls.length === 0) return;
          
          this.collidables = [];
          collidableEls.forEach((el) => {
            if (el.object3D) {
              this.collidables.push(el.object3D);
            }
          });
        }

        let collision = false;
        const currentPosition = new THREE.Vector3();
        this.el.object3D.getWorldPosition(currentPosition);

        // Check collision di semua arah
        for (const dir of this.directions) {
          const worldDir = dir.clone().applyQuaternion(this.el.object3D.quaternion);
          this.raycaster.set(currentPosition, worldDir);
          this.raycaster.far = this.data.distance;
          const intersects = this.raycaster.intersectObjects(this.collidables, false); // false = tidak recursive

          if (intersects.length > 0 && intersects[0].distance < this.data.distance) {
            // Prevent penetration - kembali ke posisi aman
            // Gunakan setAttribute untuk kompatibilitas dengan movement-controls
            const safePos = this.lastSafePosition;
            this.el.setAttribute('position', {
              x: safePos.x,
              y: safePos.y,
              z: safePos.z
            });
            collision = true;
            break;
          }
        }

        if (!collision) {
          // Update safe position jika tidak ada collision
          this.el.object3D.getWorldPosition(this.lastSafePosition);
        }
      },
    });

    // Optimize rendering performance - Aggressive optimization
    function optimizeRendering() {
      const scene = document.querySelector('a-scene');
      if (!scene) return;

      // Wait for renderer to be ready
      scene.addEventListener('renderstart', () => {
        const renderer = scene.renderer;
        if (renderer) {
          // Enable frustum culling
          renderer.frustumCulled = true;
          
          // Disable shadows completely
          if (renderer.shadowMap) {
            renderer.shadowMap.enabled = false;
          }
          
          // Reduce pixel ratio untuk performa - AGGRESSIVE
          if (renderer.setPixelRatio) {
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 0.75); // Max 0.75x untuk performa maksimal
            renderer.setPixelRatio(pixelRatio);
          }
          
          // Set power preference untuk GPU
          if (renderer.setPowerPreference) {
            renderer.setPowerPreference('high-performance');
          }
          
          // Limit render resolution untuk performa
          const canvas = renderer.domElement;
          if (canvas) {
            const maxWidth = 1280;
            const maxHeight = 720;
            const currentWidth = canvas.width;
            const currentHeight = canvas.height;
            if (currentWidth > maxWidth || currentHeight > maxHeight) {
              const scale = Math.min(maxWidth / currentWidth, maxHeight / currentHeight);
              renderer.setSize(Math.floor(currentWidth * scale), Math.floor(currentHeight * scale), false);
            }
          }
        }
      });

      // Reduce texture quality dan optimize models - AGGRESSIVE
      const models = document.querySelectorAll('[gltf-model]');
      models.forEach(model => {
        model.addEventListener('model-loaded', function() {
          const object3D = this.object3D;
          if (object3D) {
            // Khusus untuk meja - pastikan tidak transparan dan solid
            const deskEl = document.getElementById('main-desk');
            const isDesk = this.id === 'main-desk' || (deskEl && (this === deskEl || deskEl.contains(this)));
            
            object3D.traverse(function(node) {
              if (node.isMesh) {
                // Disable shadows
                node.castShadow = false;
                node.receiveShadow = false;
                
                // Disable frustum culling untuk performa (meskipun counter-intuitive, 
                // tapi untuk model kecil lebih baik disable)
                node.frustumCulled = true; // Keep enabled untuk model besar
                
                // Reduce material complexity
                if (node.material) {
                  if (Array.isArray(node.material)) {
                    node.material.forEach(mat => {
                      optimizeMaterial(mat);
                      // Khusus untuk meja - pastikan tidak transparan
                      if (isDesk) {
                        mat.transparent = false;
                        mat.opacity = 1.0;
                        mat.depthWrite = true;
                        mat.depthTest = true;
                      }
                    });
                  } else {
                    optimizeMaterial(node.material);
                    // Khusus untuk meja - pastikan tidak transparan
                    if (isDesk) {
                      node.material.transparent = false;
                      node.material.opacity = 1.0;
                      node.material.depthWrite = true;
                      node.material.depthTest = true;
                    }
                  }
                }
                
                // Simplify geometry jika memungkinkan
                if (node.geometry) {
                  node.geometry.computeBoundingSphere();
                  // Disable dynamic updates
                  node.geometry.dynamic = false;
                  node.geometry.verticesNeedUpdate = false;
                  node.geometry.normalsNeedUpdate = false;
                  node.geometry.colorsNeedUpdate = false;
                  node.geometry.uvsNeedUpdate = false;
                }
                
                // Disable matrix auto update untuk performa
                node.matrixAutoUpdate = true; // Keep true untuk movement
              }
            });
          }
        });
      });
    }

    // Optimize material untuk performa - AGGRESSIVE
    function optimizeMaterial(material) {
      if (!material) return;
      
      // Disable features yang tidak perlu
      material.needsUpdate = false;
      
      // Pastikan material tidak transparan - Force opacity = 1.0
      if (material.transparent === true || (material.opacity !== undefined && material.opacity < 1.0)) {
        material.transparent = false;
        material.opacity = 1.0;
        material.needsUpdate = true;
      }
      material.depthWrite = true;
      material.depthTest = true;
      
      // Reduce texture size - AGGRESSIVE
      if (material.map) {
        material.map.generateMipmaps = false;
        material.map.minFilter = THREE.NearestFilter; // Fastest filter
        material.map.magFilter = THREE.NearestFilter; // Fastest filter
      }
      
      // Disable semua fitur material yang tidak perlu
      material.flatShading = true; // Flat shading lebih cepat
      if (material.roughness !== undefined) {
        material.roughness = 1.0; // Max roughness untuk performa
      }
      if (material.metalness !== undefined) {
        material.metalness = 0; // No metalness untuk performa
      }
      material.emissive = new THREE.Color(0x000000); // No emission
      material.envMap = null; // No environment map
    }

    // Frame rate limiting untuk konsistensi performa - AGGRESSIVE
    let lastFrameTime = 0;
    const targetFPS = 20; // Target 20 FPS untuk performa maksimal (dikurangi dari 30)
    const frameInterval = 1000 / targetFPS;

    function throttleRender() {
      const now = performance.now();
      const elapsed = now - lastFrameTime;
      
      if (elapsed < frameInterval) {
        return;
      }
      
      lastFrameTime = now - (elapsed % frameInterval);
    }

    // Compass Update Function
    function updateCompass() {
      const camera = document.querySelector('[camera]');
      const compassNeedle = document.getElementById('compass-needle');
      const compassDirection = document.getElementById('compass-direction');
      
      if (!camera || !compassNeedle || !compassDirection) {
        return;
      }
      
      // Get camera rotation
      const rotation = camera.getAttribute('rotation');
      const yaw = rotation.y || 0;
      
      // Convert yaw to compass direction (0 = North, 90 = East, 180 = South, 270 = West)
      // A-Frame: 0 degrees = looking at negative Z (North), 90 = looking at positive X (East)
      const compassAngle = -yaw; // Negative karena A-Frame rotation berbeda
      
      // Update needle rotation
      compassNeedle.style.transform = `translate(-50%, -100%) rotate(${compassAngle}deg)`;
      
      // Determine direction
      let direction = 'N';
      let angle = (yaw + 360) % 360;
      
      if (angle >= 337.5 || angle < 22.5) {
        direction = 'N';
      } else if (angle >= 22.5 && angle < 67.5) {
        direction = 'NE';
      } else if (angle >= 67.5 && angle < 112.5) {
        direction = 'E';
      } else if (angle >= 112.5 && angle < 157.5) {
        direction = 'SE';
      } else if (angle >= 157.5 && angle < 202.5) {
        direction = 'S';
      } else if (angle >= 202.5 && angle < 247.5) {
        direction = 'SW';
      } else if (angle >= 247.5 && angle < 292.5) {
        direction = 'W';
      } else if (angle >= 292.5 && angle < 337.5) {
        direction = 'NW';
      }
      
      compassDirection.textContent = direction;
    }
    
    // Initialize compass update loop
    function initCompass() {
      const scene = document.querySelector('a-scene');
      if (!scene) {
        setTimeout(initCompass, 100);
        return;
      }
      
      if (scene.hasLoaded) {
        // Update compass every frame
        setInterval(updateCompass, 100); // Update setiap 100ms untuk performa
      } else {
        scene.addEventListener('loaded', () => {
          setInterval(updateCompass, 100);
        });
      }
    }

    // Initialize experiment flow after DOM loaded
    document.addEventListener('DOMContentLoaded', () => {
      // Optimize rendering first
      optimizeRendering();
      
      // Setup sprint controls
      setupSprintControls();
      
      // Verify movement-controls setelah scene loaded
      const scene = document.querySelector('a-scene');
      function verifyMovement() {
        const rig = document.getElementById('rig');
        if (rig) {
          console.log('✓ Rig element found');
          if (rig.components && rig.components['movement-controls']) {
            console.log('✓ Movement-controls component active');
            console.log('  Speed:', rig.getAttribute('movement-controls').speed);
            console.log('  Fly:', rig.getAttribute('movement-controls').fly);
          } else {
            console.error('✗ Movement-controls component NOT found!');
          }
        } else {
          console.error('✗ Rig element NOT found!');
        }
      }
      
      if (scene && scene.hasLoaded) {
        setTimeout(verifyMovement, 1000);
      } else {
        scene.addEventListener('loaded', () => {
          setTimeout(verifyMovement, 1000);
        });
      }
      
      // Start lazy loading cotton jar
      setTimeout(() => {
        loadCottonJarLazy();
      }, 500);
      
      // Initialize experiment flow
          setTimeout(() => {
        initExperimentFlow();
      }, 1000);
    });

    // Hide loading indicator when scene is ready
    document.querySelector('a-scene').addEventListener('loaded', () => {
      // Check if small models are loaded
            setTimeout(() => {
        const assets = document.querySelector('a-assets');
        if (assets) {
          const smallModels = ['desk-model', 'bunsen-model', 'petri-model', 'thermometer-model', 'deodorant-model'];
          let allLoaded = true;
          
          smallModels.forEach(modelId => {
            const asset = assets.querySelector(`#${modelId}`);
            if (asset && !asset.hasLoaded) {
              allLoaded = false;
            }
          });
          
          if (allLoaded) {
            const loadingIndicator = document.getElementById('loading-indicator');
            if (loadingIndicator && !document.getElementById('cotton-jar-model')) {
              // Only hide if cotton jar hasn't started loading yet
              const loadingText = document.getElementById('loading-text');
              if (loadingText) {
                loadingText.setAttribute('value', 'Loading cotton swab...');
              }
            }
          }
        }
      }, 2000);
    });

    // Info untuk pengguna
    console.log('BioExplore loaded successfully!');
    // Catatan: File ini seharusnya dilayani melalui server (server.js) untuk menghindari masalah CORS
    // Jika model GLB gagal dimuat, fallback models akan digunakan secara otomatis

  </script>

  <!-- Final Question Popup -->
  <div id="finalQuestionPopup" class="final-question-popup">
    <h3>Pertanyaan Evaluasi</h3>
    <div class="question-item">
      <p>1. Apa yang terjadi pada bakteri setelah diberi deodoran?</p>
      <label><input type="radio" name="q1" value="a"> A. Bakteri mati</label>
      <label><input type="radio" name="q1" value="b"> B. Bakteri berkembang</label>
      <label><input type="radio" name="q1" value="c"> C. Bakteri tidak berubah</label>
    </div>
    <div class="question-item">
      <p>2. Mengapa deodoran dapat mempengaruhi pertumbuhan bakteri?</p>
      <textarea id="answer2" rows="3" placeholder="Jawab di sini..."></textarea>
    </div>
    <button id="submitAnswer" onclick="submitAnswers()">Submit</button>
  </div>

  <script>
    function submitAnswers() {
      const q1 = document.querySelector('input[name="q1"]:checked');
      const q2 = document.getElementById('answer2').value;
      
      if (!q1 || !q2) {
        alert('Silakan jawab semua pertanyaan!');
        return;
      }
      
      console.log('Jawaban Q1:', q1.value);
      console.log('Jawaban Q2:', q2);
      
      // Hide popup
      document.getElementById('finalQuestionPopup').style.display = 'none';
      
      // Show completion message
      showMessage('Terima kasih! Eksperimen selesai.', 3000);
    }
  </script>
